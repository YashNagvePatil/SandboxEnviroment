apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  ai-server

  template:
    metadata:
      labels:
        app:  ai-server
    spec:
      containers:
      - image:  ai-orchestration
        imagePullPolicy: IfNotPresent
        name:  my-name
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        env:
        - name:  GEMINI_API_KEY
          valueFrom:  
            secretKeyRef:
              key:  GEMINI_API_KEY
              name:  ai-secret    
        livenessProbe:
          httpGet:
            path: api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
     
        ports:
        - containerPort:  3000
          name:  ai-server-port
     