apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name:  notification-deployment
  labels:
    name:  notification-deployment
spec:
   replicas: 1
   selector:
    matchLabels:
      app:  notification
   template:
    metadata:
      labels:
        app:  notification
    spec:
      containers:
      - image:  notification
        name:  notification-server
        resources:
          requests:
            cpu: "150m"
            memory: "100M"
          
          limits: 
            cpu: "300M"
            memory: "200M"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 4000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 4000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
          - name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                key: EMAIL_USER
                name:  google
        
          - name: GOOGLE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                key: GOOGLE_CLIENT_ID
                name:  google    

          - name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                key: GOOGLE_CLIENT_SECRET
                name:  google    

          - name: GOOGLE_REFRESH_TOKEN
            valueFrom:
              secretKeyRef:
                key:  GOOGLE_REFRESH_TOKEN
                name:  google    

          - name: RABITMQ_URL
            valueFrom:
              secretKeyRef:
                key:  GOOGLE_REFRESH_TOKEN
                name:  database                    
        ports:
        - containerPort:  4000
          name:  my-name
      