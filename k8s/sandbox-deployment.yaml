apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  sandbox
  
  template:
    metadata:
      labels:
        app:  sandbox
        tier: api
    spec:
      serviceAccountName: resource-manager
      containers:
      - image:  sandbox
        imagePullPolicy: IfNotPresent
        name: main-sandbox-container
        resources:
          requests:
            cpu: "20m"
            memory: "55M"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
            
        ports:
        - containerPort:  3000
          name:  main-sandbox
      
     